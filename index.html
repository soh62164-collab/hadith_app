<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিস অনুসন্ধান</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302b;--mute:#5b736d;--acc:#0f5c4d;--line:#d4dfdb;--ok:#0f6b3a;--warn:#9a5b00;--bad:#a3261c}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a17;--card:#152622;--ink:#e6efec;--mute:#93aaa3;--acc:#5fc3a8;--line:#29403a;--ok:#6fd39a;--warn:#e6b35a;--bad:#f08b80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",system-ui,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 16px}
.box{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
button{background:var(--acc);color:var(--bg);border:0;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:8px}.tabs label{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tabs input{display:none}.tabs input:checked+span{font-weight:700;color:var(--acc)}
.note{font-size:.82rem;color:var(--mute);border-left:3px solid var(--warn);padding:4px 10px;margin:14px 0}
.h{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.ar{font-family:Amiri,serif;font-size:1.5rem;direction:rtl;text-align:right;line-height:2.1;margin:0 0 8px}
.ref{font-size:.85rem;color:var(--mute);margin-top:8px}
.g{display:inline-block;font-size:.82rem;font-weight:600;margin:4px 8px 0 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
#st{margin-top:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>হাদিস অনুসন্ধান</h1>
<p class="sub">যাচাইকৃত হাদিস ডেটাবেস থেকে সরাসরি দেখানো হয়। কোনো হাদিস বানানো হয় না।</p>

<div class="box">
  <select id="book" aria-label="হাদিস গ্রন্থ">
    <option value="bukhari">সহিহ বুখারি</option>
    <option value="muslim">সহিহ মুসলিম</option>
    <option value="tirmidhi">জামে তিরমিজি</option>
    <option value="abudawud">সুনানে আবু দাউদ</option>
    <option value="nasai">সুনানে নাসাঈ</option>
    <option value="ibnmajah">সুনানে ইবনে মাজাহ</option>
  </select>
  <div class="tabs">
    <label><input type="radio" name="m" value="num" checked><span>নম্বর দিয়ে</span></label>
    <label><input type="radio" name="m" value="kw"><span>শব্দ দিয়ে</span></label>
  </div>
  <input id="q" type="text" inputmode="numeric" placeholder="হাদিস নম্বর লিখুন, যেমন ১ বা 1" aria-label="অনুসন্ধান">
  <button id="go">খুঁজুন</button>
</div>

<p class="note">হাদিসের মান আলেমদের মধ্যে ভিন্ন হতে পারে, তাই মানের সাথে উৎস দেখানো হয়। আমল বা ফতোয়ার আগে যোগ্য আলেমের কাছ থেকে যাচাই করে নিন।</p>
<div id="st"></div>
<div id="out"></div>
</main>

<script>
var CDN="https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/";
var cache={};
var $=function(i){return document.getElementById(i)};
var st=$("st"),out=$("out"),q=$("q");

function bn2en(s){return s.replace(/[০-৯]/g,function(d){return "০১২৩৪৫৬৭৮৯".indexOf(d)})}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function mode(){return document.querySelector('input[name=m]:checked').value}

document.querySelectorAll('input[name=m]').forEach(function(r){
  r.addEventListener("change",function(){
    q.value="";
    if(mode()==="num"){q.inputMode="numeric";q.placeholder="হাদিস নম্বর লিখুন, যেমন ১ বা 1"}
    else{q.inputMode="text";q.placeholder="বাংলা শব্দ লিখুন, যেমন নিয়ত"}
  });
});

function gradeClass(g){
  var t=(g||"").toLowerCase();
  if(t.indexOf("sahih")>-1||t.indexOf("hasan")>-1) return "ok";
  if(t.indexOf("daif")>-1||t.indexOf("da'if")>-1||t.indexOf("weak")>-1) return "warn";
  if(t.indexOf("maudu")>-1||t.indexOf("fabricated")>-1||t.indexOf("munkar")>-1) return "bad";
  return "";
}

function card(h,ar,bookName){
  var gr="";
  if(h.grades&&h.grades.length){
    h.grades.forEach(function(x){gr+='<span class="g '+gradeClass(x.grade)+'">'+esc(x.grade)+' ('+esc(x.name)+')</span>'});
  }else{
    gr='<span class="g">মানের তথ্য এই ডেটায় নেই। অন্য নির্ভরযোগ্য উৎসে যাচাই করুন।</span>';
  }
  var r=h.reference?(' | অধ্যায় '+esc(h.reference.book)+', হাদিস '+esc(h.reference.hadith)):'';
  return '<article class="h">'+(ar?'<p class="ar">'+esc(ar)+'</p>':'')+
    '<div>'+esc(h.text)+'</div><div>'+gr+'</div>'+
    '<div class="ref">'+esc(bookName)+', হাদিস নং '+esc(h.hadithnumber)+r+'</div></article>';
}

function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function one(d){return d&&d.hadiths?d.hadiths[0]:d}

function byNumber(b,n,name){
  st.textContent="খুঁজছি...";out.innerHTML="";
  var bn=getJSON(CDN+"ben-"+b+"/"+n+".json");
  var ar=getJSON(CDN+"ara-"+b+"/"+n+".json").then(function(d){return one(d).text}).catch(function(){return ""});
  Promise.all([bn,ar]).then(function(v){
    st.textContent="";out.innerHTML=card(one(v[0]),v[1],name);
  }).catch(function(){st.textContent="এই নম্বরে হাদিস পাওয়া যায়নি বা ইন্টারনেট সংযোগে সমস্যা হয়েছে।"});
}

function byWord(b,w,name){
  out.innerHTML="";
  var p=cache[b]?Promise.resolve(cache[b]):(st.textContent="গ্রন্থ লোড হচ্ছে, প্রথমবার কিছুক্ষণ লাগতে পারে...",
    getJSON(CDN+"ben-"+b+".json").then(function(d){cache[b]=d;return d}));
  p.then(function(d){
    var res=d.hadiths.filter(function(h){return h.text&&h.text.indexOf(w)>-1});
    if(!res.length){st.textContent="কোনো ফলাফল পাওয়া যায়নি। অন্য শব্দ দিয়ে চেষ্টা করুন।";return}
    st.textContent=res.length+"টি ফলাফল"+(res.length>20?" (প্রথম ২০টি দেখানো হচ্ছে)":"");
    out.innerHTML=res.slice(0,20).map(function(h){return card(h,"",name)}).join("");
  }).catch(function(){st.textContent="লোড করা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন."});
}

function run(){
  var v=bn2en(q.value.trim());
  if(!v){st.textContent="আগে কিছু লিখুন।";return}
  var s=$("book"),name=s.options[s.selectedIndex].text;
  if(mode()==="num"){
    if(!/^\d+$/.test(v)){st.textContent="নম্বর মোডে শুধু সংখ্যা লিখুন।";return}
    byNumber(s.value,v,name);
  }else byWord(s.value,q.value.trim(),name);
}
$("go").addEventListener("click",run);
q.addEventListener("keydown",function(e){if(e.key==="Enter")run()});
</script>
</body>
</html>
